name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

      - name: Ensure build-tools installed
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          JDK_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          bubblewrap updateConfig \
            --jdkPath="$JDK_PATH" \
            --androidSdkPath="$ANDROID_SDK_ROOT"

      - name: Create Bubblewrap project
        run: |
          mkdir -p android
          cd android
          bubblewrap init --manifest=https://majidamirizadeh.github.io/TestAbfaAmiri/manifest.json

      - name: Build Android
        run: |
          cd android
          bubblewrap build --skipSigning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABFA-Test-APK
          path: |
            android/app-release-unsigned.apk
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: warn
